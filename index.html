<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clinic Visits</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6f8f">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clinic Visits">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root { --bg:#f4f6f8; --card:#fff; --ink:#1f2933; --muted:#6b7785; --brand:#2f6f8f; --line:#dde3e9; --bad:#b42318; --ok:#1a7f4b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  [hidden] { display:none !important; }
  h2,h3 { margin:0; }
  header { background:var(--brand); color:#fff; padding:12px 20px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header .title { font-weight:600; font-size:17px; }
  header button { background:rgba(255,255,255,.18); }
  nav { display:flex; gap:4px; padding:10px 20px 0; border-bottom:1px solid var(--line); background:var(--card); }
  nav button { background:none; color:var(--muted); border-radius:6px 6px 0 0; border-bottom:3px solid transparent; }
  nav button.on { color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
  main { max-width:1000px; margin:20px auto; padding:0 16px; }
  .card, table { background:var(--card); border:1px solid var(--line); border-radius:8px; }
  table { width:100%; border-collapse:separate; border-spacing:0; overflow:hidden; }
  th, td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { background:#eef2f5; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  tr:last-child td { border-bottom:none; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { font:inherit; border:0; border-radius:6px; padding:8px 14px; background:var(--brand); color:#fff; cursor:pointer; }
  button.sm { padding:4px 10px; font-size:13px; }
  button.ghost { background:#e6ebf0; color:var(--ink); }
  button:disabled { opacity:.6; cursor:wait; }
  input, select, textarea { font:inherit; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  textarea { min-height:140px; resize:vertical; }
  label { display:block; margin:0 0 10px; font-size:13px; color:var(--muted); }
  label input, label select, label textarea { margin-top:4px; color:var(--ink); }
  label.chk { display:flex; gap:8px; align-items:center; color:var(--ink); }
  label.chk input { width:auto; margin:0; }
  .muted { color:var(--muted); }
  .badge { padding:2px 8px; border-radius:10px; font-size:12px; background:#e6ebf0; }
  .st-SCHEDULED{background:#e3eefb;color:#1d4e89} .st-CHECKED_IN{background:#fff1d6;color:#8a5a00}
  .st-IN_PROGRESS{background:#e8e0fa;color:#4b2e9a} .st-COMPLETED{background:#dcf3e6;color:var(--ok)}
  .st-CANCELLED,.st-NO_SHOW{background:#fde4e1;color:var(--bad)}
  #login { max-width:360px; margin:12vh auto; padding:24px; }
  #login h2 { margin-bottom:16px; }
  .err { color:var(--bad); min-height:20px; margin:6px 0; font-size:13px; }
  .err.ok { color:var(--ok); }
  button.google { width:100%; background:#fff; color:var(--ink); border:1px solid var(--line); }
  .or { text-align:center; color:var(--muted); font-size:12px; margin:14px 0; position:relative; }
  .or::before { content:""; position:absolute; left:0; right:0; top:50%; border-top:1px solid var(--line); }
  .or span { position:relative; background:var(--card); padding:0 10px; }
  .modes { display:flex; gap:4px; margin-bottom:14px; }
  .modes button { flex:1; background:#e6ebf0; color:var(--ink); }
  .modes button.on { background:var(--brand); color:#fff; }
  #clinicBox select { width:auto; padding:4px 8px; font-size:14px; }
  #clinicBox span { background:rgba(255,255,255,.18); padding:4px 10px; border-radius:6px; font-size:14px; }
  button.link { background:none; color:var(--brand); padding:2px 0; font-size:13px; text-decoration:underline; }
  #modal { position:fixed; inset:0; background:rgba(15,23,32,.5); display:flex; align-items:flex-start; justify-content:center; padding:5vh 12px; overflow:auto; z-index:10; }
  #modalBox { background:var(--card); border-radius:10px; padding:20px; width:min(560px,100%); }
  #modalBox h3 { margin-bottom:14px; }
  .private { border:2px dashed #b7791f; background:#fffaf0; border-radius:8px; padding:12px; margin-top:14px; }
  .private h4 { margin:0 0 6px; color:#8a5a00; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1f2933; color:#fff; padding:10px 16px; border-radius:8px; opacity:0; transition:.25s; pointer-events:none; z-index:20; }
  #toast.show { opacity:1; } #toast.bad { background:var(--bad); }
  .docs { display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
  /* ---- mobile / installed-app tweaks ---- */
  input, select, textarea { font-size:16px; }               /* stops iOS zoom on focus */
  body { padding-bottom:env(safe-area-inset-bottom); }
  header { padding-top:calc(12px + env(safe-area-inset-top)); }
  @media (max-width:640px) {
    header, nav { padding-left:12px; padding-right:12px; }
    nav { overflow-x:auto; }
    main { margin:12px auto; padding:0 10px; }
    table { display:block; overflow-x:auto; white-space:nowrap; }
    #modal { padding:2vh 8px; }
    #modalBox { padding:16px; }
    #login { margin:6vh 12px; }
  }
</style>
</head>
<body>

<section id="login" class="card">
  <img src="icons/icon-192.png" width="84" height="84" alt="" style="display:block;margin:0 auto 10px;border-radius:20px">
  <h2 style="text-align:center">Clinic Visits</h2>
  <button type="button" id="googleBtn" class="google" style="margin-top:16px">Continue with Google</button>
  <div class="or"><span>or</span></div>
  <div class="modes">
    <button type="button" class="on" data-mode="signin">Sign in</button>
    <button type="button" data-mode="signup">Create account</button>
  </div>
  <form id="loginForm" autocomplete="on">
    <label id="nameRow" hidden>Full name<input name="name" autocomplete="name"></label>
    <label>Email<input type="email" name="email" required autocomplete="username"></label>
    <label>Password<input type="password" name="password" required minlength="6" autocomplete="current-password"></label>
    <div id="forgotRow" style="text-align:right;margin:-4px 0 4px"><button type="button" id="forgotBtn" class="link">Forgot password?</button></div>
    <div class="err" id="loginErr"></div>
    <button id="loginSubmit" style="width:100%">Sign in</button>
  </form>
  <p class="muted" id="signupHint" hidden style="font-size:13px">New accounts must be approved by the administrator before you can use the system.</p>
</section>

<div id="app" hidden>
  <header>
    <span class="title">Clinic Visits</span>
    <span class="row"><span id="clinicBox"></span><span id="who"></span><button class="sm" id="logout">Sign out</button></span>
  </header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>

<div id="modal" hidden><div id="modalBox"></div></div>
<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
